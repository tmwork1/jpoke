name: sync-ps-champ-ja

on:
  schedule:
    # ps-champ-jaの更新（18:00 UTC）から1時間後
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-ps-champ-ja
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare sync branch
        run: |
          git fetch origin main
          git checkout -B sync/ps-champ-ja origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov ruff mypy papermill ipykernel

      - name: Register Jupyter kernel for notebook examples
        run: python -m ipykernel install --user --name python3

      - name: Download data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ps_champ_ja/download.py

      - name: Sync data
        run: |
          python scripts/ps_champ_ja/sync_moves.py
          python scripts/ps_champ_ja/build_pokedex.py
          python scripts/ps_champ_ja/sync_learnsets.py

      - name: Detect changes
        id: changes
        run: |
          git add src/jpoke/data/ps-champ-ja/ src/jpoke/data/moves/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKENで作成したブランチ・PRではtest.ymlのpush/pull_requestが
      # 自動発火しないため、このワークフロー内で同等のチェックを実行する。
      - name: Run tests
        if: steps.changes.outputs.changed == 'true'
        id: tests
        continue-on-error: true
        run: python -m pytest tests/ -q

      - name: Run ruff
        if: steps.changes.outputs.changed == 'true'
        id: ruff
        continue-on-error: true
        run: python -m ruff check src/ tests/ scripts/ examples/

      - name: Run mypy
        if: steps.changes.outputs.changed == 'true'
        id: mypy
        continue-on-error: true
        run: python -m mypy

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(sync): ps-champ-jaの最新データを同期 ($(date -u +%Y-%m-%d))"
          git push --force origin sync/ps-champ-ja

      - name: Create pull request if needed
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          RUFF_RESULT: ${{ steps.ruff.outcome }}
          MYPY_RESULT: ${{ steps.mypy.outcome }}
        run: |
          existing=$(gh pr list --head sync/ps-champ-ja --state open --json number)
          if [ "$existing" != "[]" ]; then
            exit 0
          fi

          body_file="$RUNNER_TEMP/ps-champ-ja-pr-body.md"
          {
            if [ "$TEST_RESULT" != "success" ] || [ "$RUFF_RESULT" != "success" ] || [ "$MYPY_RESULT" != "success" ]; then
              echo "⚠️ 同期後にテスト/lint/型チェックが失敗しています。新規要素（特性・技・アイテム等）の実装が必要な可能性があります。"
              echo
            fi
            echo "ps-champ-jaの最新データを同期しました。"
            echo
            for check in "テスト:$TEST_RESULT" "ruff:$RUFF_RESULT" "mypy:$MYPY_RESULT"; do
              result="失敗"
              if [ "${check#*:}" = "success" ]; then
                result="成功"
              fi
              echo "- ${check%%:*}: $result"
            done
          } > "$body_file"

          gh pr create --base main --head sync/ps-champ-ja \
            --title "chore(sync): ps-champ-jaの最新データを同期" \
            --body-file "$body_file"
